<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Portfolio | Campus Connect</title>

<link rel="stylesheet"
      href="css/style.css">

</head>

<body>

<header class="header">

<div class="container nav">

<a href="dashboard.html"
   class="logo">

Campus<span>Connect</span>

</a>

</div>

</header>


<main>

<section class="hero">

<div class="container">

<div class="auth-card">

<h1>
My Portfolio
</h1>

<p>
Showcase your skills
</p>


<form id="portfolioForm">


<input
type="tel"
id="phone"
placeholder="Phone number (shown to people who contact you)"
required
>


<select
id="category"
required>

<option value="">
Select Skill Category
</option>

<option>
Video Editing
</option>

<option>
UI/UX Design
</option>

<option>
Web Development
</option>

<option>
Photography
</option>

<option>
Content Writing
</option>

<option>
Marketing
</option>

</select>


<input
type="text"
id="skills"
placeholder="Skills (comma separated)"
>


<textarea
id="description"
placeholder="Tell us about your skills..."
rows="6">
</textarea>


<input
type="url"
id="portfolioLink"
placeholder="Portfolio link"
>


<label class="checkbox-row">

<input
type="checkbox"
id="availability"
checked
>

Available for work

</label>


<button
type="submit"
class="primary-btn">

Save Portfolio

</button>


</form>

</div>

</div>

</section>

</main>


<script src="js/portfolio.js"></script>

</body>

</html>
